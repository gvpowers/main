<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <defs>
    <linearGradient id="sky7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8ddf2"/>
      <stop offset="1" stop-color="#eef4fd"/>
    </linearGradient>
    <linearGradient id="sun7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdd26a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb0c4"/>
      <stop offset="1" stop-color="#75869c"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc26a"/>
      <stop offset="1" stop-color="#7aa749"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#sky7)"/>

  <!-- Sun -->
  <circle cx="540" cy="100" r="48" fill="url(#sun7)"/>
  <g stroke="#f5b53a" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="540" y1="34" x2="540" y2="52"/>
    <line x1="540" y1="148" x2="540" y2="166"/>
    <line x1="474" y1="100" x2="492" y2="100"/>
    <line x1="588" y1="100" x2="606" y2="100"/>
    <line x1="493" y1="53" x2="507" y2="41"/>
    <line x1="587" y1="53" x2="573" y2="41"/>
  </g>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="150" cy="78" rx="56" ry="18"/>
    <ellipse cx="195" cy="66" rx="34" ry="13"/>
    <ellipse cx="90" cy="96" rx="30" ry="10"/>
  </g>

  <!-- Distant hills -->
  <path d="M0 300 Q160 210 320 280 T640 250 V420 H0 Z" fill="url(#hills)" opacity="0.5"/>
  <path d="M0 340 Q200 250 420 320 T640 300 V420 H0 Z" fill="#8ab95a" opacity="0.7"/>

  <!-- Transmission towers -->
  <g stroke="#75869c" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Tower 1 -->
    <path d="M90 360 V230 L90 230"/>
    <path d="M56 360 L90 280 L124 360"/>
    <path d="M90 230 L76 300 L90 300 L104 300"/>
    <path d="M74 300 L60 360"/>
    <path d="M106 300 L120 360"/>
    <path d="M70 250 L110 250"/>
    <!-- Tower 2 -->
    <path d="M300 360 V250"/>
    <path d="M268 360 L300 296 L332 360"/>
    <path d="M300 250 L288 316 L300 316 L312 316"/>
    <path d="M286 316 L272 360"/>
    <path d="M314 316 L328 360"/>
    <path d="M282 270 L318 270"/>
  </g>
  <!-- Power lines -->
  <g stroke="#0e3b73" stroke-width="2" fill="none" opacity="0.85">
    <path d="M90 222 Q190 190 300 240"/>
    <path d="M90 206 Q190 176 300 226"/>
    <path d="M300 232 Q420 190 540 250"/>
    <path d="M300 218 Q420 178 540 236"/>
  </g>

  <!-- Solar farm foreground right -->
  <g transform="translate(420 256)">
    <g>
      <g transform="rotate(-6)">
        <rect x="0" y="0" width="78" height="46" rx="3" fill="#155094"/>
        <rect x="6" y="6" width="30" height="16" fill="#0f3a7a"/>
        <rect x="6" y="26" width="30" height="14" fill="#1660a8"/>
        <rect x="40" y="6" width="30" height="16" fill="#1660a8"/>
        <rect x="40" y="26" width="30" height="14" fill="#0f3a7a"/>
      </g>
    </g>
    <g transform="translate(0 56) rotate(-6)">
      <rect x="0" y="0" width="78" height="46" rx="3" fill="#155094"/>
      <rect x="6" y="6" width="30" height="16" fill="#1660a8"/>
      <rect x="6" y="26" width="30" height="14" fill="#0f3a7a"/>
      <rect x="40" y="6" width="30" height="16" fill="#0f3a7a"/>
      <rect x="40" y="26" width="30" height="14" fill="#1660a8"/>
    </g>
  </g>

  <!-- Green field foreground -->
  <rect x="0" y="380" width="640" height="40" fill="#7aa749"/>

  <!-- Wind turbines far -->
  <g stroke="#e6ecf3" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8">
    <line x1="220" y1="250" x2="196" y2="210"/>
    <line x1="220" y1="250" x2="220" y2="196"/>
    <line x1="220" y1="250" x2="244" y2="210"/>
    <path d="M220 250 V360" stroke="#8fa0b8" stroke-width="4"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3e2f3"/>
      <stop offset="1" stop-color="#eef4fd"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#c3cbdb"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e3b73"/>
      <stop offset="1" stop-color="#08224a"/>
    </linearGradient>
    <linearGradient id="bat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5aa6"/>
      <stop offset="1" stop-color="#0f3a7a"/>
    </linearGradient>
    <linearGradient id="floor3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aebccf"/>
      <stop offset="1" stop-color="#93a2b8"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#sky3)"/>
  <!-- Room walls hint -->
  <path d="M0 60 L200 40 L640 30 L640 420 L0 420 Z" fill="#ffffff" opacity="0.5"/>

  <!-- Floor -->
  <rect x="0" y="360" width="640" height="60" fill="url(#floor3)"/>

  <!-- Main UPS rack -->
  <g>
    <rect x="210" y="120" width="220" height="240" rx="10" fill="url(#rack)"/>
    <rect x="210" y="120" width="220" height="240" rx="10" fill="none" stroke="#9aa8bd" stroke-width="2"/>

    <!-- Top control display unit -->
    <rect x="224" y="134" width="192" height="56" rx="6" fill="url(#panel)"/>
    <rect x="238" y="148" width="90" height="28" rx="4" fill="#081b38"/>
    <!-- screen bars -->
    <rect x="244" y="156" width="8" height="12" fill="#4ade80"/>
    <rect x="256" y="152" width="8" height="16" fill="#fdd26a"/>
    <rect x="268" y="150" width="8" height="18" fill="#f87171"/>
    <rect x="280" y="148" width="8" height="20" fill="#60a5fa"/>
    <rect x="292" y="154" width="8" height="14" fill="#4ade80"/>
    <circle cx="348" cy="162" r="8" fill="#f87171"/>
    <circle cx="368" cy="162" r="8" fill="#fdd26a"/>
    <circle cx="388" cy="162" r="8" fill="#4ade80"/>

    <!-- Battery modules -->
    <g>
      <rect x="224" y="202" width="192" height="18" rx="4" fill="url(#bat)"/>
      <rect x="236" y="206" width="24" height="10" rx="2" fill="#0c3469"/>
      <rect x="268" y="206" width="24" height="10" rx="2" fill="#0c3469"/>
      <rect x="300" y="206" width="24" height="10" rx="2" fill="#0c3469"/>
      <rect x="332" y="206" width="24" height="10" rx="2" fill="#0c3469"/>
      <rect x="364" y="206" width="24" height="10" rx="2" fill="#0c3469"/>

      <rect x="224" y="226" width="192" height="18" rx="4" fill="#1660a8"/>
      <rect x="236" y="230" width="24" height="10" rx="2" fill="#0f4080"/>
      <rect x="268" y="230" width="24" height="10" rx="2" fill="#0f4080"/>
      <rect x="300" y="230" width="24" height="10" rx="2" fill="#0f4080"/>
      <rect x="332" y="230" width="24" height="10" rx="2" fill="#0f4080"/>
      <rect x="364" y="230" width="24" height="10" rx="2" fill="#0f4080"/>

      <rect x="224" y="250" width="192" height="18" rx="4" fill="url(#bat)"/>
      <rect x="236" y="254" width="24" height="10" rx="2" fill="#0c3469"/>
      <rect x="268" y="254" width="24" height="10" rx="2" fill="#0c3469"/>
      <rect x="300" y="254" width="24" height="10" rx="2" fill="#0c3469"/>
      <rect x="332" y="254" width="24" height="10" rx="2" fill="#0c3469"/>
      <rect x="364" y="254" width="24" height="10" rx="2" fill="#0c3469"/>

      <rect x="224" y="274" width="192" height="18" rx="4" fill="#1660a8"/>
      <rect x="236" y="278" width="24" height="10" rx="2" fill="#0f4080"/>
      <rect x="268" y="278" width="24" height="10" rx="2" fill="#0f4080"/>
      <rect x="300" y="278" width="24" height="10" rx="2" fill="#0f4080"/>
      <rect x="332" y="278" width="24" height="10" rx="2" fill="#0f4080"/>
      <rect x="364" y="278" width="24" height="10" rx="2" fill="#0f4080"/>
    </g>

    <!-- Bottom vents + feet -->
    <g fill="#9aa8bd">
      <rect x="236" y="306" width="16" height="30" rx="2"/>
      <rect x="264" y="306" width="16" height="30" rx="2"/>
      <rect x="292" y="306" width="16" height="30" rx="2"/>
      <rect x="320" y="306" width="16" height="30" rx="2"/>
      <rect x="348" y="306" width="16" height="30" rx="2"/>
      <rect x="376" y="306" width="16" height="30" rx="2"/>
    </g>
    <!-- Status LED strip -->
    <rect x="224" y="198" width="192" height="4" rx="2" fill="#4ade80"/>
  </g>

  <!-- Adjacent server rack hint -->
  <g opacity="0.55">
    <rect x="470" y="150" width="90" height="210" rx="6" fill="#d7dee8"/>
    <rect x="480" y="160" width="70" height="16" rx="2" fill="#b9c4d6"/>
    <rect x="480" y="182" width="70" height="16" rx="2" fill="#b9c4d6"/>
    <rect x="480" y="204" width="70" height="16" rx="2" fill="#b9c4d6"/>
    <rect x="480" y="226" width="70" height="16" rx="2" fill="#b9c4d6"/>
  </g>

  <!-- Cables from rack -->
  <g stroke="#0e3b73" stroke-width="6" fill="none" opacity="0.85">
    <path d="M240 340 C230 352 235 360 255 366"/>
    <path d="M400 340 C414 352 410 362 392 368"/>
  </g>

  <!-- Glow behind -->
  <circle cx="320" cy="200" r="150" fill="#60a5fa" opacity="0.06"/>
</svg>

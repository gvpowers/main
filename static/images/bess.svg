<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cddfef"/>
      <stop offset="1" stop-color="#eef4fd"/>
    </linearGradient>
    <linearGradient id="sun4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdd26a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="container" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f9"/>
      <stop offset="1" stop-color="#c7d2e0"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e3b73"/>
      <stop offset="1" stop-color="#0a2c55"/>
    </linearGradient>
    <linearGradient id="ground4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb5c2"/>
      <stop offset="1" stop-color="#83a0b0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#sky4)"/>

  <!-- Sun + rays -->
  <circle cx="540" cy="80" r="40" fill="url(#sun4)"/>
  <g stroke="#f5b53a" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="540" y1="22" x2="540" y2="40"/>
    <line x1="442" y1="80" x2="462" y2="80"/>
    <line x1="538" y1="178" x2="538" y2="160"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="360" width="640" height="60" fill="url(#ground4)"/>
  <rect x="0" y="360" width="640" height="8" fill="#90a9b8"/>

  <!-- BESS container -->
  <g>
    <!-- Container body -->
    <rect x="120" y="150" width="360" height="212" rx="12" fill="url(#container)"/>
    <rect x="120" y="150" width="360" height="212" rx="12" fill="none" stroke="#9fb0c4" stroke-width="2"/>

    <!-- Cooling grille panel -->
    <rect x="148" y="196" width="120" height="120" rx="8" fill="#dde5ee" stroke="#9fb0c4"/>
    <g stroke="#9fb0c4" stroke-width="5" stroke-linecap="round">
      <line x1="166" y1="214" x2="250" y2="214"/>
      <line x1="166" y1="232" x2="250" y2="232"/>
      <line x1="166" y1="250" x2="250" y2="250"/>
      <line x1="166" y1="268" x2="250" y2="268"/>
      <line x1="166" y1="286" x2="250" y2="286"/>
    </g>

    <!-- Door with status + handle -->
    <rect x="290" y="176" width="150" height="140" rx="8" fill="#eef3f9" stroke="#9fb0c4"/>
    <circle cx="314" cy="196" r="6" fill="#4ade80"/>
    <circle cx="336" cy="196" r="6" fill="#fdd26a"/>
    <rect x="292" y="212" width="146" height="3" fill="#c7d2e0"/>
    <rect x="408" y="240" width="10" height="46" rx="5" fill="#9fb0c4"/>
    <!-- battery rack symbol inside door -->
    <rect x="318" y="228" width="38" height="12" rx="2" fill="#0f3a7a"/>
    <rect x="318" y="246" width="38" height="12" rx="2" fill="#1660a8"/>
    <rect x="318" y="264" width="38" height="12" rx="2" fill="#0f3a7a"/>

    <!-- Bottom vents -->
    <g fill="#b7c4d4">
      <rect x="148" y="330" width="10" height="18" rx="2"/>
      <rect x="164" y="330" width="10" height="18" rx="2"/>
      <rect x="180" y="330" width="10" height="18" rx="2"/>
    </g>

    <!-- Roof accent -->
    <rect x="120" y="150" width="360" height="14" rx="6" fill="url(#lid)"/>
    <!-- Brand plate -->
    <rect x="330" y="322" width="80" height="16" rx="3" fill="#0e3b73"/>
    <text x="370" y="334" font-family="Arial" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">BESS</text>
  </g>

  <!-- Safety cones -->
  <g>
    <path d="M90 364 l6 -34 h8 l6 34 z" fill="#f87171"/>
    <rect x="90" y="362" width="20" height="6" rx="2" fill="#e5e7eb"/>
    <path d="M474 364 l6 -34 h8 l6 34 z" fill="#fbbf24"/>
    <rect x="474" y="362" width="20" height="6" rx="2" fill="#e5e7eb"/>
  </g>

  <!-- Trees / greenery -->
  <g fill="#5b8f33" opacity="0.85">
    <ellipse cx="55" cy="352" rx="24" ry="34"/>
    <ellipse cx="585" cy="356" rx="22" ry="30"/>
  </g>
  <rect x="56" y="388" width="5" height="18" fill="#6d4c2f"/>
  <rect x="587" y="390" width="5" height="16" fill="#6d4c2f"/>

  <!-- Small solar modules adjacent -->
  <g transform="translate(470 210) rotate(-8)">
    <rect x="0" y="0" width="40" height="44" fill="#155094" stroke="#2a5c9a"/>
    <rect x="4" y="4" width="14" height="16" fill="#0f3a7a"/>
    <rect x="22" y="4" width="14" height="16" fill="#1660a8"/>
    <rect x="4" y="24" width="14" height="16" fill="#1660a8"/>
    <rect x="22" y="24" width="14" height="16" fill="#0f3a7a"/>
  </g>
</svg>

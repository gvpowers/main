<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e5f4"/>
      <stop offset="1" stop-color="#eef4fd"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#c6cfdb"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e3b73"/>
      <stop offset="1" stop-color="#08224a"/>
    </linearGradient>
    <linearGradient id="alt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dde4ee"/>
      <stop offset="1" stop-color="#aebccf"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c4d6"/>
      <stop offset="1" stop-color="#9aa8bd"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#sky2)"/>

  <!-- Floor -->
  <rect x="0" y="340" width="640" height="80" fill="url(#floor)"/>
  <rect x="0" y="340" width="640" height="8" fill="#a9b6ca"/>

  <!-- Generator skid frame -->
  <rect x="120" y="306" width="400" height="34" rx="6" fill="url(#frame)"/>
  <rect x="130" y="340" width="8" height="22" fill="#8896aa"/>
  <rect x="502" y="340" width="8" height="22" fill="#8896aa"/>

  <!-- Alternator (cylindrical, front) -->
  <ellipse cx="470" cy="238" rx="62" ry="58" fill="url(#alt)"/>
  <ellipse cx="470" cy="238" rx="62" ry="58" fill="none" stroke="#8fa0b8" stroke-width="2"/>
  <ellipse cx="470" cy="238" rx="30" ry="28" fill="#c3cedd"/>
  <circle cx="424" cy="238" r="10" fill="#0e3b73"/>
  <g stroke="#9aa8bd" stroke-width="2">
    <line x1="470" y1="180" x2="470" y2="296"/>
    <line x1="408" y1="238" x2="532" y2="238"/>
  </g>

  <!-- Connecting shaft -->
  <rect x="430" y="228" width="72" height="20" rx="4" fill="#7d8ba1"/>

  <!-- Engine block -->
  <rect x="208" y="196" width="210" height="98" rx="10" fill="url(#body)"/>
  <rect x="208" y="196" width="210" height="98" rx="10" fill="none" stroke="#a9b6ca" stroke-width="2"/>

  <!-- Coolant top hose + filler -->
  <rect x="238" y="178" width="70" height="18" rx="6" fill="#0e3b73"/>
  <circle cx="300" cy="196" r="9" fill="#0e3b73"/>
  <circle cx="300" cy="196" r="4" fill="#fdd26a"/>

  <!-- Air intake filter -->
  <rect x="330" y="200" width="40" height="36" rx="6" fill="#8896aa"/>
  <path d="M336 210 l10 -8 h18 l8 8 z" fill="#5b6b82"/>

  <!-- Engine top details -->
  <g fill="none" stroke="#a9b6ca" stroke-width="2">
    <line x1="250" y1="222" x2="380" y2="222"/>
    <line x1="250" y1="242" x2="380" y2="242"/>
    <line x1="250" y1="262" x2="380" y2="262"/>
  </g>

  <!-- Dipstick + small pump -->
  <rect x="206" y="220" width="14" height="12" rx="2" fill="#5b6b82"/>
  <rect x="262" y="288" width="26" height="12" fill="#8896aa"/>

  <!-- Control panel -->
  <rect x="180" y="150" width="90" height="46" rx="6" fill="#0e3b73"/>
  <circle cx="202" cy="172" r="7" fill="#f87171"/>
  <circle cx="224" cy="172" r="7" fill="#4ade80"/>
  <rect x="242" y="164" width="18" height="16" rx="3" fill="#fdd26a"/>
  <rect x="180" y="150" width="90" height="7" rx="3" fill="#123f7c"/>

  <!-- Exhaust pipe -->
  <rect x="250" y="150" width="14" height="46" fill="#5b6b82"/>
  <rect x="250" y="132" width="24" height="18" rx="3" fill="#6d7c92"/>

  <!-- Fuel tank (front base) -->
  <rect x="200" y="278" width="140" height="26" rx="8" fill="#e8edf4" stroke="#a9b6ca" stroke-width="2"/>
  <!-- Small flames for running -->
  <path d="M248 130 c-3 -6 3 -6 0 -12 c4 6 6 6 6 12 z" fill="#f59e0b" opacity="0.8"/>

  <!-- Base plates -->
  <rect x="124" y="300" width="396" height="8" fill="#b9c4d6"/>
</svg>

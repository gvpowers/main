<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3fd"/>
      <stop offset="1" stop-color="#eef4fd"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdd26a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#155094"/>
      <stop offset="1" stop-color="#0c3469"/>
    </linearGradient>
    <linearGradient id="panel2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c66b0"/>
      <stop offset="1" stop-color="#123f7c"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f9db1"/>
      <stop offset="1" stop-color="#6a7789"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="640" height="420" fill="url(#sky)"/>

  <!-- Sun and rays -->
  <circle cx="545" cy="82" r="46" fill="url(#sun)"/>
  <g stroke="#f5b53a" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="545" y1="18" x2="545" y2="38"/>
    <line x1="632" y1="82" x2="652" y2="82"/>
    <line x1="608" y1="40" x2="622" y2="28"/>
    <line x1="482" y1="40" x2="468" y2="28"/>
    <line x1="458" y1="82" x2="438" y2="82"/>
  </g>
  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.7">
    <ellipse cx="170" cy="70" rx="52" ry="18"/>
    <ellipse cx="205" cy="60" rx="34" ry="14"/>
    <ellipse cx="120" cy="92" rx="40" ry="12"/>
  </g>

  <!-- House -->
  <path d="M60 360 L60 210 L180 150 L300 210 L300 360 Z" fill="#f1f5f9"/>
  <path d="M60 210 L180 150 L300 210 L180 258 Z" fill="#dbe4f0"/>
  <rect x="130" y="250" width="80" height="70" rx="3" fill="#0f3a7a"/>
  <rect x="142" y="262" width="56" height="58" fill="#9fd0ff" opacity="0.8"/>
  <line x1="170" y1="262" x2="170" y2="320" stroke="#0f3a7a" stroke-width="2"/>
  <line x1="142" y1="292" x2="198" y2="292" stroke="#0f3a7a" stroke-width="2"/>

  <!-- Rooftop solar array -->
  <g transform="translate(64 168) skewX(-8)">
    <rect x="0" y="0" width="232" height="44" rx="5" fill="url(#roof)" opacity="0" />
    <g>
      <rect x="0" y="0" width="108" height="40" rx="3" fill="url(#panel)" stroke="#2a5c9a"/>
      <rect x="8" y="6" width="40" height="12" fill="#153f7e"/>
      <rect x="54" y="6" width="20" height="12" fill="#153f7e"/>
      <rect x="8" y="22" width="40" height="12" fill="#153f7e"/>
      <rect x="54" y="22" width="20" height="12" fill="#153f7e"/>
      <line x1="54" y1="6" x2="54" y2="34" stroke="#2a5c9a" stroke-width="1.5"/>
      <line x1="8" y1="18" x2="102" y2="18" stroke="#2a5c9a" stroke-width="1.5"/>
      <rect x="124" y="0" width="108" height="40" rx="3" fill="url(#panel)" stroke="#2a5c9a"/>
      <rect x="132" y="6" width="40" height="12" fill="#153f7e"/>
      <rect x="178" y="6" width="20" height="12" fill="#153f7e"/>
      <rect x="132" y="22" width="40" height="12" fill="#153f7e"/>
      <rect x="178" y="22" width="20" height="12" fill="#153f7e"/>
      <line x1="178" y1="6" x2="178" y2="34" stroke="#2a5c9a" stroke-width="1.5"/>
      <line x1="132" y1="18" x2="226" y2="18" stroke="#2a5c9a" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Ground -->
  <rect x="0" y="360" width="640" height="60" fill="#7cb342" opacity="0.85"/>
  <rect x="0" y="360" width="640" height="14" fill="#8bc34a"/>
  <!-- Trees -->
  <g fill="#5b8f33">
    <ellipse cx="380" cy="348" rx="26" ry="40"/>
    <ellipse cx="430" cy="356" rx="20" ry="32"/>
  </g>
  <rect x="386" y="388" width="6" height="24" fill="#6d4c2f"/>
  <rect x="432" y="390" width="5" height="20" fill="#6d4c2f"/>

  <!-- Roof-mounted inverter/battery near house -->
  <rect x="330" y="330" width="70" height="34" rx="5" fill="url(#panel2)"/>
  <rect x="338" y="338" width="22" height="18" rx="2" fill="#0c3469"/>
  <circle cx="386" cy="347" r="4" fill="#4ade80"/>
  <rect x="310" y="345" width="20" height="8" rx="2" fill="#8896aa"/>
  <circle cx="390" cy="318" r="10" fill="#f59e0b" opacity="0.15"/>
</svg>

{% extends 'base.html' %}
{% block title %}Page Not Found | {{ settings.company_name }}{% endblock %}
{% block content %}
<section class="error-page">
    <div>
        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you are looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('public.home') }}" class="btn btn-primary">Back to Home</a>
        <a href="{{ url_for('public.contact') }}" class="btn btn-ghost-glass">Contact Us</a>
    </div>
</section>
{% endblock %}

<div class="floating-contact">
    <a class="fab fab-quote" href="{{ url_for('public.contact') }}" aria-label="Get a Quote" title="Get a Quote">
        <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-2 6h-4v-1h4v1zm0 3h-4v-1h4v1zm-5-6h3v3h-3V7zm0 4h3v3h-3v-3zM8 11l2 3-2 3H5l-1-3 1-3h3z"/></svg>
        <span>Get a Quote</span>
    </a>
    <a class="fab fab-call" href="tel:{{ settings.phone_1_tel }}" aria-label="Call GV POWERS" title="Call Now">
        <svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>
        <span>Call</span>
    </a>
    {% if settings.whatsapp %}
    <a class="fab fab-whatsapp" href="https://wa.me/{{ settings.whatsapp }}" target="_blank" rel="noopener" aria-label="WhatsApp" title="WhatsApp">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 2a8 8 0 1 1-4.1 14.9l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 0 1 12 4zm-3 4c-.2 0-.5.3-.7.6-.4.5-1.2 1.6-.6 3.2.8 1.9 2.6 3.8 5 4.8 2.3 1 3.3.7 3.8.4.4-.2.7-.8.9-1.3.1-.5.1-.9.1-1 0-.1-.2-.3-.4-.4l-1.6-.8c-.3-.1-.5-.2-.7.1l-.7.9c-.2.2-.4.3-.8.1-.4-.2-1.7-.8-2.7-1.9-1-1-1.5-1.8-1.6-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4-.1-.6l-.6-1.6c-.2-.4-.4-.4-.6-.4H9z"/></svg>
        <span>WhatsApp</span>
    </a>
    {% endif %}
    <a class="fab fab-email" href="mailto:{{ settings.email_1 }}" aria-label="Email GV POWERS" title="Email">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
        <span>Email</span>
    </a>
</div>
